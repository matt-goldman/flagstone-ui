name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI Workload
        run: dotnet workload install maui-windows --skip-sign-check
      - name: Restore
        run: dotnet restore Flagstone.UI.CI.slnf --locked-mode
      - name: Build
        timeout-minutes: 10
        run: dotnet build Flagstone.UI.CI.slnf --configuration Release --no-restore
      - name: Test
        timeout-minutes: 5
        run: dotnet test Flagstone.UI.CI.slnf --configuration Release --no-build --verbosity normal --logger "console;verbosity=detailed"
